name: Deploy to Homologation

on:
  push:
    branches: [ 'release/**' ]
  
  # Manual trigger for hotfixes
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch to deploy'
        required: true
        default: 'release/v1.0.0'

env:
  HEROKU_APP_NAME_HOM: decksmith-batch-hom
  PYTHON_VERSION: "3.11"

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Extract version from branch
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
          VERSION=${GITHUB_REF#refs/heads/release/}
        else
          VERSION="${{ github.event.inputs.release_branch }}"
          VERSION=${VERSION#release/}
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Deploying version: ${VERSION}"
    
    - name: Validate version format
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        if [[ ! $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid version format: $VERSION. Expected format: vX.Y.Z"
          exit 1
        fi

  test-comprehensive:
    runs-on: ubuntu-latest
    needs: validate-release
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decksmith_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set environment variables for testing
      run: |
        echo "DECKSMITH_ENVIRONMENT=homologation" >> $GITHUB_ENV
        echo "DATABASE_HOST=localhost" >> $GITHUB_ENV
        echo "DATABASE_PORT=5432" >> $GITHUB_ENV
        echo "DATABASE_NAME=decksmith_test" >> $GITHUB_ENV
        echo "DATABASE_USER=postgres" >> $GITHUB_ENV
        echo "DATABASE_PASSWORD=postgres" >> $GITHUB_ENV
        echo "ML_ENABLE_DEEP_LEARNING=true" >> $GITHUB_ENV
        echo "ML_USE_GPU=false" >> $GITHUB_ENV
        echo "ML_BATCH_SIZE=64" >> $GITHUB_ENV
    
    - name: Run database setup
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d decksmith_test -f database_schema.sql
    
    - name: Run comprehensive tests
      run: |
        python -m pytest tests/ -v --cov=src/ --cov-report=xml --cov-fail-under=80
    
    - name: Run integration tests
      run: |
        python -m pytest tests/integration/ -v --maxfail=5
    
    - name: Run performance tests
      run: |
        python -m pytest tests/performance/ -v --benchmark-only

  security-audit:
    runs-on: ubuntu-latest
    needs: validate-release
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep
    
    - name: Run comprehensive security checks
      run: |
        # Dependency vulnerabilities
        safety check --json --output safety-report.json || true
        
        # Code security issues
        bandit -r src/ -f json -o bandit-report.json || true
        
        # SAST scanning
        semgrep --config=auto --json --output=semgrep-report.json src/ || true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-audit-reports
        path: |
          safety-report.json
          bandit-report.json
          semgrep-report.json

  build-and-test-docker:
    runs-on: ubuntu-latest
    needs: validate-release
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t decksmith-batch:${{ needs.validate-release.outputs.version }} .
    
    - name: Test Docker image
      run: |
        docker run --rm -e DECKSMITH_ENVIRONMENT=homologation \
          decksmith-batch:${{ needs.validate-release.outputs.version }} \
          python -c "from src.infrastructure.config.environment_config import EnvironmentAwareConfigManager; print('Docker image OK')"

  deploy-homologation:
    needs: [validate-release, test-comprehensive, security-audit, build-and-test-docker]
    runs-on: ubuntu-latest
    environment: homologation
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Create release tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git tag -a ${{ needs.validate-release.outputs.version }} -m "Release ${{ needs.validate-release.outputs.version }}"
        git push origin ${{ needs.validate-release.outputs.version }}
    
    - name: Deploy to Heroku Homologation
      uses: akhileshns/heroku-deploy@v3.12.14
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
        heroku_app_name: ${{ env.HEROKU_APP_NAME_HOM }}
        heroku_email: ${{ secrets.HEROKU_EMAIL }}
        usedocker: false
        
    - name: Set Heroku environment variables
      run: |
        heroku config:set \
          DECKSMITH_ENVIRONMENT=homologation \
          DECKSMITH_VERSION=${{ needs.validate-release.outputs.version }} \
          ML_ENABLE_DEEP_LEARNING=true \
          ML_USE_GPU=false \
          ML_BATCH_SIZE=64 \
          ML_EPOCHS=20 \
          DATABASE_SSL_MODE=require \
          MONITORING_ENABLED=true \
          MONITORING_LOG_LEVEL=INFO \
          NOTIFICATIONS_ENABLED=true \
          SECURITY_RATE_LIMIT_ENABLED=true \
          SECURITY_RATE_LIMIT_REQUESTS=200 \
          --app ${{ env.HEROKU_APP_NAME_HOM }}
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    
    - name: Run database migrations
      run: |
        heroku run python -c "
        import asyncio
        from src.infrastructure.database.connection import DatabaseConnection
        from src.infrastructure.config.environment_config import EnvironmentAwareConfigManager
        
        async def migrate():
            config = EnvironmentAwareConfigManager()
            db = DatabaseConnection(config)
            await db.initialize()
            print('Database migration completed')
            await db.cleanup()
        
        asyncio.run(migrate())
        " --app ${{ env.HEROKU_APP_NAME_HOM }}
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    
    - name: Warm up application
      run: |
        sleep 60
        for i in {1..5}; do
          curl -f https://${{ env.HEROKU_APP_NAME_HOM }}.herokuapp.com/health || echo "Attempt $i failed"
          sleep 10
        done
    
    - name: Run smoke tests
      run: |
        python -m pytest tests/smoke/ --url=https://${{ env.HEROKU_APP_NAME_HOM }}.herokuapp.com -v
    
    - name: Notify deployment success
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        text: |
          🚀 Homologation deployment successful!
          Version: ${{ needs.validate-release.outputs.version }}
          Branch: ${{ github.ref }}
          App: https://${{ env.HEROKU_APP_NAME_HOM }}.herokuapp.com
          
          Ready for production review and testing.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_HOM }}
    
    - name: Notify deployment failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#deployments'
        text: |
          ❌ Homologation deployment failed!
          Version: ${{ needs.validate-release.outputs.version }}
          Branch: ${{ github.ref }}
          Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_HOM }}

  create-release-notes:
    needs: [deploy-homologation, validate-release]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Generate release notes
      run: |
        git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD~1)..HEAD > release-notes.md
        echo "## Changes in ${{ needs.validate-release.outputs.version }}" > temp.md
        cat release-notes.md >> temp.md
        mv temp.md release-notes.md
    
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ needs.validate-release.outputs.version }}
        release_name: Release ${{ needs.validate-release.outputs.version }}
        body_path: release-notes.md
        draft: false
        prerelease: true