name: Deploy to Production

on:
  push:
    branches: [ main ]
  
  # Manual trigger for production deployments
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "PRODUCTION" to confirm deployment'
        required: true
      version_tag:
        description: 'Version tag to deploy (e.g., v1.0.0)'
        required: true

env:
  HEROKU_APP_NAME_PROD: decksmith-batch-prod
  PYTHON_VERSION: "3.11"

jobs:
  validate-production-deployment:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.validate.outputs.proceed }}
      version: ${{ steps.validate.outputs.version }}
      
    steps:
    - name: Validate manual deployment
      id: validate
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          if [[ "${{ github.event.inputs.confirm_production }}" != "PRODUCTION" ]]; then
            echo "Production deployment not confirmed"
            exit 1
          fi
          echo "proceed=true" >> $GITHUB_OUTPUT
          echo "version=${{ github.event.inputs.version_tag }}" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          # Only deploy on main if there's a version tag
          if git describe --exact-match --tags HEAD 2>/dev/null; then
            VERSION=$(git describe --exact-match --tags HEAD)
            echo "proceed=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "No version tag found on main branch"
            echo "proceed=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "proceed=false" >> $GITHUB_OUTPUT
        fi

  pre-production-checks:
    runs-on: ubuntu-latest
    needs: validate-production-deployment
    if: needs.validate-production-deployment.outputs.proceed == 'true'
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.validate-production-deployment.outputs.version }}
    
    - name: Verify homologation deployment
      run: |
        # Check if homologation is healthy
        curl -f https://decksmith-batch-hom.herokuapp.com/health
        
        # Verify version matches
        DEPLOYED_VERSION=$(curl -s https://decksmith-batch-hom.herokuapp.com/version | jq -r '.version')
        if [[ "$DEPLOYED_VERSION" != "${{ needs.validate-production-deployment.outputs.version }}" ]]; then
          echo "Homologation version mismatch: expected ${{ needs.validate-production-deployment.outputs.version }}, got $DEPLOYED_VERSION"
          exit 1
        fi
    
    - name: Check recent deployments
      run: |
        # Prevent multiple deployments in short succession
        LAST_DEPLOY=$(heroku releases --app decksmith-batch-prod --json | jq -r '.[0].created_at')
        LAST_DEPLOY_TIMESTAMP=$(date -d "$LAST_DEPLOY" +%s)
        NOW=$(date +%s)
        DIFF=$((NOW - LAST_DEPLOY_TIMESTAMP))
        
        # Require at least 1 hour between deployments
        if [[ $DIFF -lt 3600 ]]; then
          echo "Last deployment was less than 1 hour ago. Waiting for safety."
          exit 1
        fi
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY_PROD }}

  production-approval:
    runs-on: ubuntu-latest
    needs: [validate-production-deployment, pre-production-checks]
    if: needs.validate-production-deployment.outputs.proceed == 'true'
    environment: production
    
    steps:
    - name: Manual approval required
      run: |
        echo "Production deployment approved for version ${{ needs.validate-production-deployment.outputs.version }}"

  comprehensive-security-audit:
    runs-on: ubuntu-latest
    needs: [validate-production-deployment, pre-production-checks]
    if: needs.validate-production-deployment.outputs.proceed == 'true'
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.validate-production-deployment.outputs.version }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Run security audit
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep
        
        # Critical vulnerability check
        safety check --full-report --exit-code
        
        # Security linting
        bandit -r src/ -ll -f json -o bandit-critical.json
        
        # Check for high-severity issues
        if [[ $(cat bandit-critical.json | jq '.results | length') -gt 0 ]]; then
          echo "Critical security issues found"
          cat bandit-critical.json | jq '.results'
          exit 1
        fi

  final-testing:
    runs-on: ubuntu-latest
    needs: [validate-production-deployment, pre-production-checks]
    if: needs.validate-production-deployment.outputs.proceed == 'true'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decksmith_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.validate-production-deployment.outputs.version }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set production-like environment
      run: |
        echo "DECKSMITH_ENVIRONMENT=production" >> $GITHUB_ENV
        echo "DATABASE_HOST=localhost" >> $GITHUB_ENV
        echo "DATABASE_PORT=5432" >> $GITHUB_ENV
        echo "DATABASE_NAME=decksmith_test" >> $GITHUB_ENV
        echo "DATABASE_USER=postgres" >> $GITHUB_ENV
        echo "DATABASE_PASSWORD=postgres" >> $GITHUB_ENV
        echo "ML_ENABLE_DEEP_LEARNING=true" >> $GITHUB_ENV
        echo "ML_USE_GPU=false" >> $GITHUB_ENV
        echo "ML_BATCH_SIZE=128" >> $GITHUB_ENV
        echo "SECURITY_RATE_LIMIT_ENABLED=true" >> $GITHUB_ENV
    
    - name: Run production tests
      run: |
        PGPASSWORD=postgres psql -h localhost -U postgres -d decksmith_test -f database_schema.sql
        python -m pytest tests/production/ -v --maxfail=1

  deploy-production:
    needs: [
      production-approval,
      comprehensive-security-audit,
      final-testing,
      validate-production-deployment
    ]
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.validate-production-deployment.outputs.version }}
    
    - name: Backup current production
      run: |
        # Create backup of current production state
        heroku pg:backups:capture --app ${{ env.HEROKU_APP_NAME_PROD }}
        
        # Store current version for rollback
        CURRENT_VERSION=$(heroku config:get DECKSMITH_VERSION --app ${{ env.HEROKU_APP_NAME_PROD }})
        echo "ROLLBACK_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY_PROD }}
    
    - name: Enable maintenance mode
      run: |
        heroku maintenance:on --app ${{ env.HEROKU_APP_NAME_PROD }}
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY_PROD }}
    
    - name: Deploy to Production
      uses: akhileshns/heroku-deploy@v3.12.14
      with:
        heroku_api_key: ${{ secrets.HEROKU_API_KEY_PROD }}
        heroku_app_name: ${{ env.HEROKU_APP_NAME_PROD }}
        heroku_email: ${{ secrets.HEROKU_EMAIL_PROD }}
        usedocker: false
    
    - name: Set production environment variables
      run: |
        heroku config:set \
          DECKSMITH_ENVIRONMENT=production \
          DECKSMITH_VERSION=${{ needs.validate-production-deployment.outputs.version }} \
          ML_ENABLE_DEEP_LEARNING=true \
          ML_USE_GPU=true \
          ML_BATCH_SIZE=128 \
          ML_EPOCHS=50 \
          DATABASE_SSL_MODE=require \
          MONITORING_ENABLED=true \
          MONITORING_LOG_LEVEL=WARNING \
          NOTIFICATIONS_ENABLED=true \
          SECURITY_RATE_LIMIT_ENABLED=true \
          SECURITY_RATE_LIMIT_REQUESTS=1000 \
          SECURITY_USER_AGENT_VERIFICATION=true \
          --app ${{ env.HEROKU_APP_NAME_PROD }}
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY_PROD }}
    
    - name: Run production database migrations
      run: |
        heroku run python -c "
        import asyncio
        from src.infrastructure.database.connection import DatabaseConnection
        from src.infrastructure.config.environment_config import EnvironmentAwareConfigManager
        
        async def migrate():
            config = EnvironmentAwareConfigManager()
            print(f'Running migrations for environment: {config.get_environment()}')
            db = DatabaseConnection(config)
            await db.initialize()
            print('Production database migration completed successfully')
            await db.cleanup()
        
        asyncio.run(migrate())
        " --app ${{ env.HEROKU_APP_NAME_PROD }}
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY_PROD }}
    
    - name: Disable maintenance mode
      run: |
        heroku maintenance:off --app ${{ env.HEROKU_APP_NAME_PROD }}
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY_PROD }}
    
    - name: Health check and warmup
      run: |
        # Wait for application to start
        sleep 60
        
        # Health check with retries
        for i in {1..10}; do
          if curl -f https://${{ env.HEROKU_APP_NAME_PROD }}.herokuapp.com/health; then
            echo "Health check passed"
            break
          else
            echo "Health check attempt $i failed"
            if [[ $i -eq 10 ]]; then
              echo "Health check failed after 10 attempts"
              exit 1
            fi
            sleep 30
          fi
        done
        
        # Warmup critical endpoints
        curl -s https://${{ env.HEROKU_APP_NAME_PROD }}.herokuapp.com/version
        curl -s https://${{ env.HEROKU_APP_NAME_PROD }}.herokuapp.com/metrics
    
    - name: Run production smoke tests
      run: |
        python -m pytest tests/smoke/ --url=https://${{ env.HEROKU_APP_NAME_PROD }}.herokuapp.com -v --maxfail=1
    
    - name: Monitor initial metrics
      run: |
        # Wait and check initial metrics
        sleep 120
        
        # Check error rates, response times, etc.
        curl -s https://${{ env.HEROKU_APP_NAME_PROD }}.herokuapp.com/metrics | jq .
    
    - name: Update GitHub release
      run: |
        gh release edit ${{ needs.validate-production-deployment.outputs.version }} \
          --prerelease=false \
          --notes "✅ Successfully deployed to production on $(date)"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Notify successful deployment
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#production'
        text: |
          🚀 Production deployment successful!
          Version: ${{ needs.validate-production-deployment.outputs.version }}
          App: https://${{ env.HEROKU_APP_NAME_PROD }}.herokuapp.com
          
          Deployment completed at $(date)
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PROD }}

  rollback-on-failure:
    needs: [deploy-production, validate-production-deployment]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
    - name: Emergency rollback
      run: |
        echo "Deployment failed, initiating rollback"
        
        # Enable maintenance mode
        heroku maintenance:on --app ${{ env.HEROKU_APP_NAME_PROD }}
        
        # Rollback to previous release
        heroku rollback --app ${{ env.HEROKU_APP_NAME_PROD }}
        
        # Disable maintenance mode
        heroku maintenance:off --app ${{ env.HEROKU_APP_NAME_PROD }}
        
        # Verify rollback
        sleep 30
        curl -f https://${{ env.HEROKU_APP_NAME_PROD }}.herokuapp.com/health
      env:
        HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY_PROD }}
    
    - name: Notify rollback
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#production'
        text: |
          🚨 Production deployment failed and was rolled back!
          Attempted version: ${{ needs.validate-production-deployment.outputs.version }}
          Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          @channel Please investigate immediately.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PROD }}